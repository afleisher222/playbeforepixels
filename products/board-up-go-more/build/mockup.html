<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Up! Go! More! mockup</title>
<link rel="stylesheet" href="../../../brand/fonts/fonts.css">
<style>
  html,body{margin:0;padding:0}
  body{width:1600px;height:1200px;overflow:hidden;background:#F3F6FB;position:relative;font-family:"Nunito Sans",sans-serif}
  .blob{position:absolute;border-radius:50%}
  .b1{width:980px;height:980px;left:-160px;top:40px;background:#FEF4D8}
  .b2{width:620px;height:620px;right:-120px;top:-180px;background:#E3EEFA}
  .table{position:absolute;left:0;right:0;bottom:0;height:310px;background:#E9EEF6}
  .ballshadow{position:absolute;left:1335px;top:872px;width:140px;height:26px;border-radius:50%;background:rgba(29,41,64,.18);filter:blur(10px)}
  /* standing board book */
  .stand{position:absolute;left:170px;top:190px;width:700px;height:700px;perspective:2200px}
  .book{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateY(22deg) rotateX(2deg)}
  .face{position:absolute;inset:0;border-radius:10px 18px 18px 10px;overflow:hidden;background:#F5B820 url(../cover.png) center/cover;transform:translateZ(22px)}
  .edge{position:absolute;top:6px;bottom:6px;right:-2px;width:44px;transform-origin:right center;transform:rotateY(90deg) translateX(22px);
        background:repeating-linear-gradient(90deg,#FFFFFF 0 7px,#E4E9F2 7px 8px);border-radius:4px}
  .spine{position:absolute;top:0;bottom:0;left:0;width:44px;transform-origin:left center;transform:rotateY(-90deg) translateX(-22px);background:#1D2940;border-radius:10px 0 0 10px}
  .shadow1{position:absolute;left:190px;top:872px;width:720px;height:60px;border-radius:50%;background:rgba(29,41,64,.22);filter:blur(22px)}
  /* open spread lying flat */
  .flat{position:absolute;left:800px;top:760px;width:720px;height:360px;perspective:1600px}
  .spread{position:absolute;inset:0;display:flex;transform:rotateX(52deg) rotateZ(-6deg);transform-style:preserve-3d;box-shadow:0 40px 60px rgba(29,41,64,.25);border-radius:8px}
  .spread img{width:360px;height:360px;display:block}
  .spread img:first-child{border-radius:8px 0 0 8px;box-shadow:inset -10px 0 0 rgba(0,0,0,.04)}
  .spread img:last-child{border-radius:0 8px 8px 0}
  .gutter{position:absolute;left:356px;top:0;bottom:0;width:8px;background:rgba(29,41,64,.10)}
  .ball{position:absolute;left:1330px;top:735px;width:150px;height:150px}
</style></head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div><div class="table"></div>
  <div class="shadow1"></div>
  <div class="stand"><div class="book"><div class="spine"></div><div class="edge"></div><div class="face"></div></div></div>
  <div class="flat"><div class="spread"><img src="../preview/p06.png" alt=""><img src="../preview/p07.png" alt=""><div class="gutter"></div></div></div>
  
</body></html>
