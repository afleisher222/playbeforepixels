<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Soft! Bumpy! Crinkle! mockup</title>
<link rel="stylesheet" href="../../../brand/fonts/fonts.css">
<style>
  html,body{margin:0;padding:0}
  body{width:1600px;height:1200px;overflow:hidden;background:#FEF4D8;position:relative;font-family:"Nunito Sans",sans-serif}
  .blob{position:absolute;border-radius:50%}
  .rug{position:absolute;left:-100px;right:-100px;top:640px;bottom:-200px;background:#FFFFFF;border-radius:50% 50% 0 0/120px 120px 0 0}
  .bk{position:absolute;border-radius:58px}
  .c1w{position:absolute;left:150px;top:210px;width:660px;height:660px;perspective:2200px}
  .c1{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateY(14deg) rotateZ(-4deg)}
  .c1 .face{position:absolute;inset:0;border-radius:56px;background:url(../cover.png) center/cover;transform:translateZ(22px)}
  .c1 .edge{position:absolute;inset:0;border-radius:60px;background:#1D2940;transform:translate(22px,14px)}
  .c1 .stitch{position:absolute;inset:14px;border-radius:44px;border:3px dashed rgba(255,255,255,.35);transform:translateZ(23px)}
  .tab{position:absolute;right:-44px;width:70px;height:38px;border-radius:19px}
  .sh1{position:absolute;left:190px;top:860px;width:680px;height:60px;border-radius:50%;background:rgba(29,41,64,.2);filter:blur(24px)}
  .c2w{position:absolute;left:880px;top:420px;width:560px;height:560px;perspective:1800px}
  .c2{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(34deg) rotateZ(7deg)}
  .c2 .face{position:absolute;inset:0;border-radius:48px;background:url(page-soft.png) center/cover;transform:translateZ(16px)}
  .c2 .edge{position:absolute;inset:0;border-radius:50px;background:#EFE6FA;transform:translate(0,18px)}
  .c2 .stitch{position:absolute;inset:12px;border-radius:38px;border:3px dashed rgba(29,41,64,.18);transform:translateZ(17px)}
  .sh2{position:absolute;left:900px;top:890px;width:580px;height:70px;border-radius:50%;background:rgba(29,41,64,.16);filter:blur(22px)}
  .tag{position:absolute;font-family:"Caveat",cursive;font-weight:700;font-size:44px;color:#1D2940}
  .pill{position:absolute;left:60px;top:60px;background:#1D2940;color:#fff;border-radius:99px;padding:12px 24px;font-weight:800;font-size:22px;letter-spacing:.12em;text-transform:uppercase}
</style></head>
<body>
  <div class="blob" style="left:900px;top:-260px;width:820px;height:820px;background:#E3EEFA"></div>
  <div class="rug"></div>
  <div class="pill">Design preview · not for sale yet</div>
  <div class="sh1"></div>
  <div class="c1w"><div class="c1"><div class="edge"></div>
    <div class="tab" style="top:150px;background:#EE5A36"></div><div class="tab" style="top:300px;background:#F5B820"></div><div class="tab" style="top:450px;background:#3D86D8"></div>
    <div class="face"></div><div class="stitch"></div></div></div>
  <div class="sh2"></div>
  <div class="c2w"><div class="c2"><div class="edge"></div><div class="face"></div><div class="stitch"></div></div></div>
  <div class="tag" style="left:240px;top:1030px">soft cloth book, 8 pages</div>
  <div class="tag" style="left:960px;top:1030px">crinkle, soft, bumpy, mirror</div>
</body></html>
